# Two Free resources, no paid disk. PostgreSQL Free expires after 30 days.
services:
  - type: web
    name: cap-avenir
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/hamza-ouchen/coachcar
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cap-avenir-db
          property: connectionString
      - key: CAP_AVENIR_ADMIN_USER
        value: admin
      - key: CAP_AVENIR_ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4.1-mini
databases:
  - name: cap-avenir-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: cap_avenir
    user: cap_avenir
